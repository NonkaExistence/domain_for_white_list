name: Build geosite.dat

on:
  push:
    paths:
      - 'domain.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install sing-box
        run: |
          go install github.com/sagernet/sing-box/cmd/sing-box@latest

      - name: Prepare domain list
        run: |
          mkdir -p rules
          cp domain.txt rules/mywhitelist.txt

      - name: Build geosite.dat
        run: |
          sing-box geosite compile rules geosite.dat

      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add geosite.dat
          git commit -m "auto build geosite.dat" || exit 0
          git push
