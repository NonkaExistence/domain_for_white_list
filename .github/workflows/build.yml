name: Build geosite.dat

on:
  push:
    paths:
      - 'domain.txt'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Install geosite builder
        run: |
          go install github.com/v2fly/v2ray-core/v5/cmd/test/geosite@latest

      - name: Build data folder
        run: |
          mkdir data
          cp domain.txt data/mywhitelist

      - name: Generate geosite.dat
        run: |
          geosite -c data -o geosite.dat

      - name: Commit result
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add geosite.dat
          git commit -m "auto build geosite.dat" || exit 0
          git push
